<header class="app-header" [class.scrolled]="isScrolled">
  <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </button>

  <!-- Клік по логотипу -->
  <div class="logo" (click)="scrollToTop()">Gart Knives</div>
  
  <nav class="navigation">
    <!-- Випадаючий список для ПК -->
    <div class="nav-item has-dropdown">
      <a href="#" (click)="$event.preventDefault()">Ножі ▾</a>
      <div class="dropdown-menu">
        <a href="#">EDC</a>
        <a href="#">Кухонні</a>
        <a href="#">Туристичні</a>
        <a href="#">Тактичні</a>
      </div>
    </div>
    <a href="#">Сокири</a>
    <a href="#">Мусати</a>
    <a href="#">Дошки</a>
  </nav>
  
  <div class="cart">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="cart-icon">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
    </svg>
  </div>
</header>

<!-- Повноекранне мобільне меню -->
<div class="mobile-menu" [class.open]="isMobileMenuOpen">
  <div class="mobile-menu-header">
    <div class="logo" (click)="scrollToTop(); toggleMobileMenu()">Gart Knives</div>
    <button class="close-btn" (click)="toggleMobileMenu()">✕</button>
  </div>
  <nav class="mobile-nav">
    <div class="mobile-nav-item">
      <a href="#" (click)="toggleKnives($event)">
        Ножі 
        <span class="arrow" [class.expanded]="isKnivesExpanded">▾</span>
      </a>
      <div class="mobile-dropdown" [class.open]="isKnivesExpanded">
        <a href="#">Всі ножі</a>
        <a href="#">EDC</a>
        <a href="#">Кухонні</a>
        <a href="#">Туристичні</a>
        <a href="#">Тактичні</a>
      </div>
    </div>
    <a href="#">Сокири</a>
    <a href="#">Мусати</a>
    <a href="#">Дошки</a>
  </nav>
</div>
